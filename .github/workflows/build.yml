name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/UE4SSManager.Core.Tests -c Release

      - name: Publish single exe
        run: dotnet publish src/UE4SSManager.App -c Release -r win-x64 -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: UE4SS-Manager
          path: publish/UE4SS-Manager.exe

      - name: Attach exe to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/UE4SS-Manager.exe
          generate_release_notes: true
